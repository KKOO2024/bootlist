<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSITM 부트캠프 - 구서영</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
  <header>
    반응형 웹페이지 예제
  </header>

  <main>
    <div class="box">이 박스는 PC 화면에서는 큼직하게,</div>
    <div class="box" id="contentbox">
        <div id="calbox">
            <div id="calendar-header">
                <button id="prev-month">&lt;</button>
                <span id="current-month">2024년 4월</span>
                <button id="next-month">&gt;</button>
              </div>              
            <div id="calendar"></div>
        </div>
        <div id="listbox">
            <div class="list">
                <button id="homework-btn">homework</button>
            </div>
            <div class="list" id="insight">깨달음</div>
            <div class="list" id="review">간단 느낀점</div>
        </div>
    </div>
  </main>
</body>
</html>
