<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSITM 부트캠프 - 구서영</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    반응형 웹페이지 예제
  </header>

  <main>
    <div class="box">이 박스는 PC 화면에서는 큼직하게,</div>

    <div class="box" id="contentbox">
      <div id="calbox">
        <div id="calendar-header">
          <button id="prev-month">&lt;</button>
          <span id="current-month"></span>
          <button id="next-month">&gt;</button>
        </div>
        <div id="calendar"></div>
      </div>

      <div id="listbox">
        <div class="list" id="homework-pa">
          <button id="homework-btn">📖숙제</button>
        </div>
        <div class="list" id="review">
          <label>Comment</label>
          <textarea id="review-input" rows="4"></textarea>
        </div>
        <div class="list" id="insight">
          <label>Review</label>
          <textarea id="insight-input" rows="4"></textarea>
        </div>

        

        <!-- ✅ homework 모달 팝업 -->
        <div id="homework-modal" class="modal hidden">
          <button class="close-btn">&times;</button>
          <iframe id="homework-frame" src=""></iframe>
        </div>
      </div>
    </div>
  </main>
  <div id="toast" class="toast hidden">저장 완료!</div>
  <script src="test.js" defer></script>
</body>
</html>
